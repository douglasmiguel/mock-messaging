global:
  scrape_interval: 5s

rule_files:
  - prometheus-alerts.yml

scrape_configs:
  - job_name: observability-service
    metrics_path: /metrics
    static_configs:
      - targets:
          - observability-service:8000
  - job_name: order-service
    metrics_path: /metrics/business
    static_configs:
      - targets:
          - order-service:8000
